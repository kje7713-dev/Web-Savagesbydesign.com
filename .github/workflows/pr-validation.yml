name: PR Validation

on:
  pull_request:
    branches: ["main"]
    paths:
      - "sbd-brutalist/**"
      - "site-src/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
      - "DEPLOYMENT.md"
      - "docs/storydonkey-beta-signup.md"
      - "AGENTS.md"
  push:
    branches: ["codex/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Check PHP syntax
        run: |
          set -euo pipefail
          find sbd-brutalist -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build and validate static foundation
        run: npm run check

      - name: Test StoryDonkey beta signup
        run: node --test tests/storydonkey-beta-signup.test.mjs

      - name: Check workflow YAML syntax
        run: |
          ruby <<'RUBY'
          require 'yaml'
          Dir['.github/workflows/*.yml'].each do |file|
            YAML.load_file(file)
            puts "valid: #{file}"
          end
          RUBY
