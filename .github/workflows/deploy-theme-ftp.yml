name: Deploy WP Theme (FTP)

on:
  push:
    branches: ["main"]
    paths:
      - "sbd-brutalist/**"
      - ".github/workflows/deploy-theme-ftp.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy theme via FTP (force refresh)
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DEST: ${{ secrets.FTP_DEST }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          # Host timestamps can be newer than the checkout. --ignore-time is
          # required so changed PHP files and new templates are uploaded.
          lftp -c "set ftp:ssl-force false; set ssl:verify-certificate false; open -u \"$FTP_USER\",\"$FTP_PASS\" 157.173.208.128; mirror --reverse --continue --dereference --ignore-time -x '^\\.git/$' sbd-brutalist \"$FTP_DEST\"; quit"

      - name: Purge LiteSpeed cache
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X GET \
            "https://savagesbydesign.com/?litespeed=purge&type=all" \
            -H "X-LiteSpeed-Purge: *"