name: Deploy WP Theme (FTP)

on:
  push:
    branches: ["main"]
    paths:
      - "sbd-brutalist/**"
      - ".github/workflows/deploy-theme-ftp.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Write deployment marker
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          printf 'sha=%s\ndeployed_at=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > sbd-brutalist/deployment-marker.txt

      - name: Deploy theme via FTP
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DEST: ${{ secrets.FTP_DEST }}
        run: |
          lftp -c "set ftp:ssl-force false; set ssl:verify-certificate false; open -u \"$FTP_USER\",\"$FTP_PASS\" 157.173.208.128; mirror --reverse --continue --dereference --ignore-time -x '^\\.git/$' sbd-brutalist \"$FTP_DEST\"; quit"

      - name: Verify required files exist under FTP_DEST
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DEST: ${{ secrets.FTP_DEST }}
        run: |
          lftp -c "set ftp:ssl-force false; set ssl:verify-certificate false; open -u \"$FTP_USER\",\"$FTP_PASS\" 157.173.208.128; cls -1 \"$FTP_DEST/functions.php\" \"$FTP_DEST/deployment-marker.txt\" \"$FTP_DEST/page-storydonkey.php\" \"$FTP_DEST/page-storydonkey-privacy.php\" \"$FTP_DEST/page-storydonkey-terms.php\" \"$FTP_DEST/page-storydonkey-support.php\"; quit"

      - name: Smoke-test production routes
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -u
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          failures=0

          check_route() {
            slug="$1"
            expected="$2"
            headers="$temp_dir/${slug}.headers"
            body="$temp_dir/${slug}.body"
            url="https://savagesbydesign.com/${slug}/?deploy=${GITHUB_SHA}&sbd_diag=1"
            result="$(curl --silent --show-error --location --retry 2 --max-time 30 \
              -D "$headers" -o "$body" -w '%{http_code}\t%{url_effective}' "$url" 2>&1)"
            curl_status=$?
            status="${result%%$'\t'*}"
            final_url="${result#*$'\t'}"
            [ "$curl_status" -eq 0 ] || status="curl-error"

            header_value() {
              grep -i "^$1:" "$headers" | tail -1 | cut -d: -f2- | tr -d '\r' | sed 's/^ *//' || true
            }

            theme="$(header_value 'X-SBD-Theme')"
            route_seen="$(header_value 'X-SBD-Route-Seen')"
            route_matched="$(header_value 'X-SBD-Route-Matched')"
            redirect_fired="$(header_value 'X-SBD-Template-Redirect')"
            template_exists="$(header_value 'X-SBD-Template-Exists')"
            deploy="$(header_value 'X-SBD-Deploy')"
            cache="$(header_value 'X-LiteSpeed-Cache')"
            expected_ok=no
            sha_ok=no
            [ "$curl_status" -eq 0 ] && grep -Fq "$expected" "$body" && expected_ok=yes
            [ "$curl_status" -eq 0 ] && grep -Fq "$GITHUB_SHA" "$body" && sha_ok=yes
            route_marker=no
            [ "$theme" = active ] && [ "$route_matched" = yes ] && [ "$redirect_fired" = fired ] && route_marker=yes

            printf '%-20s status=%-9s sha=%-3s route-marker=%-3s expected=%-3s theme=%-6s deploy=%-12s seen=%-28s matched=%-3s template=%-3s redirect=%-6s cache=%s final=%s\n' \
              "$slug" "$status" "$sha_ok" "$route_marker" "$expected_ok" "$theme" "${deploy:-?}" "$route_seen" "$route_matched" "$template_exists" "$redirect_fired" "${cache:-?}" "$final_url"

            if [ "$status" != 200 ] || [ "$sha_ok" != yes ] || [ "$route_marker" != yes ] || [ "$expected_ok" != yes ]; then
              failures=$((failures + 1))
            fi
          }

          check_route "storydonkey" "StoryDonkey"
          check_route "storydonkey-privacy" "StoryDonkey Privacy Policy"
          check_route "storydonkey-terms" "StoryDonkey Terms of Use"
          check_route "storydonkey-support" "StoryDonkey Support"
          [ "$failures" -eq 0 ] || exit 1

      - name: Note cache limitation
        run: |
          echo "Production smoke tests use commit-specific query strings. LiteSpeed purge is not treated as proof of invalidation."
