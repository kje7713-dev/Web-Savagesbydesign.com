name: Deploy WP Theme (FTP)

on:
  push:
    branches: ["main"]
    paths:
      - "sbd-brutalist/**"
      - ".github/workflows/deploy-theme-ftp.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy theme via FTP (verbose)
        uses: sebastianpopp/ftp-action@v2.0.0
        with:
          host: 157.173.208.128
          user: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          localDir: "sbd-brutalist"
          # FTP_DEST is relative to the FTP account root (already public_html).
          remoteDir: "${{ secrets.FTP_DEST }}"
          # Host timestamps can be newer than the checkout, causing changed PHP
          # files and newly added templates to be skipped by lftp mirror.
          options: "--ignore-time"

      - name: Purge LiteSpeed cache
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X GET \
            "https://savagesbydesign.com/?litespeed=purge&type=all" \
            -H "X-LiteSpeed-Purge: *"