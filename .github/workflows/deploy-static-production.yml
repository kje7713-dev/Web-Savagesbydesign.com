name: Cut Over Production to Static Site

# Manual, explicit production cutover over the verified Hostinger SSH/SFTP
# path. The old WordPress files remain available for rollback; index.php is
# moved to a SHA-stamped backup before static files are uploaded.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CUTOVER to deploy the static site over the active WordPress document root'
        required: true
        type: string

permissions:
  contents: read

env:
  PRODUCTION_SFTP_DEST: /home/u818755784/domains/savagesbydesign.com/public_html

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Require explicit cutover confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = 'CUTOVER'

      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and validate production static output
        env:
          SBD_DEPLOYMENT_SHA: ${{ github.sha }}
        run: npm run check

      - name: Prepare strict SSH host verification
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/production_deploy_key"
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > "$HOME/.ssh/production_known_hosts"
          chmod 600 "$HOME/.ssh/production_deploy_key" "$HOME/.ssh/production_known_hosts"
          ssh-keygen -lf "$HOME/.ssh/production_known_hosts" >/dev/null

      - name: Verify exact production destination over SSH and SFTP
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          PRODUCTION_SFTP_DEST: ${{ env.PRODUCTION_SFTP_DEST }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "$HOME/.ssh/production_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/production_known_hosts" -o BatchMode=yes -o ConnectTimeout=20 -p "$STAGING_SSH_PORT")
          resolved_path="$(ssh "${ssh_opts[@]}" "$STAGING_SSH_USER@$STAGING_SSH_HOST" sh -s -- "$PRODUCTION_SFTP_DEST" <<'REMOTE'
          set -eu
          test "$#" -eq 1
          test -d "$1"
          realpath -e -- "$1"
          REMOTE
          )"
          test "$resolved_path" = "$PRODUCTION_SFTP_DEST"
          printf 'verified SSH destination: %s\n' "$resolved_path"
          printf 'pwd\ncd %s\npwd\n' "$PRODUCTION_SFTP_DEST" |
            sftp -q -b - -i "$HOME/.ssh/production_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/production_known_hosts" -P "$STAGING_SSH_PORT" "$STAGING_SSH_USER@$STAGING_SSH_HOST"

      - name: Disable WordPress front controller with rollback copy
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          GITHUB_SHA: ${{ github.sha }}
          PRODUCTION_SFTP_DEST: ${{ env.PRODUCTION_SFTP_DEST }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "$HOME/.ssh/production_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/production_known_hosts" -o BatchMode=yes -o ConnectTimeout=20 -p "$STAGING_SSH_PORT")
          ssh "${ssh_opts[@]}" "$STAGING_SSH_USER@$STAGING_SSH_HOST" sh -s -- "$PRODUCTION_SFTP_DEST" "$GITHUB_SHA" <<'REMOTE'
          set -eu
          root="$1"
          sha="$2"
          backup="$root/.wordpress-index-backup-$sha.php"
          if [ -e "$root/index.php" ]; then
            mv -- "$root/index.php" "$backup"
          fi
          test ! -e "$root/index.php"
          find "$root" -maxdepth 1 -name '.wordpress-index-backup-*.php' -type f -print -quit | grep -q .
          REMOTE

      - name: Upload static output to verified production path via SFTP
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          PRODUCTION_SFTP_DEST: ${{ env.PRODUCTION_SFTP_DEST }}
        run: |
          set -euo pipefail
          batch_file="$(mktemp)"
          trap 'rm -f "$batch_file"' EXIT
          printf 'cd "%s"\n' "$PRODUCTION_SFTP_DEST" > "$batch_file"
          while IFS= read -r -d '' directory; do
            relative="${directory#dist/}"
            if [ "$relative" != "$directory" ]; then
              case "$relative" in
                *[!A-Za-z0-9._/-]*) echo "Unsupported generated path: $relative" >&2; exit 1 ;;
              esac
              printf -- '-mkdir "%s"\n' "$relative" >> "$batch_file"
            fi
          done < <(find dist -type d -print0 | sort -z)
          while IFS= read -r -d '' file; do
            relative="${file#dist/}"
            case "$relative" in
              *[!A-Za-z0-9._/-]*) echo "Unsupported generated path: $relative" >&2; exit 1 ;;
            esac
            printf 'put "%s" "%s"\n' "$file" "$relative" >> "$batch_file"
          done < <(find dist -type f -print0 | sort -z)
          printf 'put "dist/storydonkey-privacy/index.html" "storydonkey-privacy-static.html"\n' >> "$batch_file"
          printf 'put "dist/storydonkey-terms/index.html" "storydonkey-terms-static.html"\n' >> "$batch_file"
          printf 'put "dist/storydonkey-support/index.html" "storydonkey-support-static.html"\n' >> "$batch_file"
          sftp -b "$batch_file" -i "$HOME/.ssh/production_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/production_known_hosts" -P "$STAGING_SSH_PORT" "$STAGING_SSH_USER@$STAGING_SSH_HOST"

      - name: Smoke-test static production routes
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          failures=0
          check_route() {
            slug="$1"
            expected="$2"
            body="$temp_dir/${slug:-root}.body"
            result="$(curl --silent --show-error --location --retry 2 --max-time 30 \
              -o "$body" -w '%{http_code}\t%{url_effective}' "https://savagesbydesign.com/${slug:+$slug/}?static-cutover=$GITHUB_SHA")"
            status="${result%%$'\t'*}"
            expected_ok=no
            sha_ok=no
            [ "$status" = 200 ] && grep -Fq "$expected" "$body" && expected_ok=yes
            [ "$status" = 200 ] && grep -Fq "$GITHUB_SHA" "$body" && sha_ok=yes
            printf '%-32s status=%-3s sha=%-3s expected=%-3s\n' \
              "/${slug:+$slug/}" "$status" "$sha_ok" "$expected_ok"
            if [ "$status" != 200 ] || [ "$sha_ok" != yes ] || [ "$expected_ok" != yes ]; then
              failures=$((failures + 1))
            fi
          }
          check_route '' 'TAKE CHARGE'
          check_route 'app' 'Welcome to Savage By Design'
          check_route 'offerings' 'What We Offer'
          check_route 'guides' 'Training Guides'
          check_route 'reviews' 'Gear Reviews'
          check_route 'deals' 'Training Gear Deals'
          check_route 'contact' 'Get In Touch'
          check_route 'privacy' 'Privacy Policy'
          check_route 'terms' 'Terms of Service'
          check_route 'user-guide' 'User Guide'
          check_route 'pizza-chicken-pop-support' 'Pizza Chicken Pop Support'
          check_route 'storydonkey' 'StoryDonkey'
          check_route 'storydonkey-privacy' 'StoryDonkey Privacy Policy'
          check_route 'storydonkey-terms' 'StoryDonkey Terms of Use'
          check_route 'storydonkey-support' 'StoryDonkey Support'
          test "$failures" -eq 0
