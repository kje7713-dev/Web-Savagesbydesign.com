name: Deploy Static Site to Staging

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  deploy:
    name: Build, upload, and smoke-test staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build and validate static output
        env:
          SBD_DEPLOYMENT_SHA: ${{ github.sha }}
        run: npm run check

      - name: Require staging-only configuration
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          STAGING_SFTP_DEST: ${{ secrets.STAGING_SFTP_DEST }}
        run: |
          set -euo pipefail
          : "${STAGING_BASE_URL:?STAGING_BASE_URL is required}"
          : "${STAGING_SSH_HOST:?STAGING_SSH_HOST is required}"
          : "${STAGING_SSH_PORT:?STAGING_SSH_PORT is required}"
          : "${STAGING_SSH_USER:?STAGING_SSH_USER is required}"
          : "${STAGING_SSH_PRIVATE_KEY:?STAGING_SSH_PRIVATE_KEY is required}"
          : "${STAGING_SSH_KNOWN_HOSTS:?STAGING_SSH_KNOWN_HOSTS is required}"
          : "${STAGING_SFTP_DEST:?STAGING_SFTP_DEST is required}"
          case "$STAGING_BASE_URL" in
            https://*) ;;
            *) echo 'STAGING_BASE_URL must use HTTPS'; exit 1 ;;
          esac
          test "$STAGING_SSH_HOST" = '157.173.208.128' || { echo 'STAGING_SSH_HOST must be the approved Hostinger staging host'; exit 1; }
          test "$STAGING_SSH_PORT" = '65002' || { echo 'STAGING_SSH_PORT must be 65002'; exit 1; }
          test "$STAGING_SSH_USER" = 'u818755784' || { echo 'STAGING_SSH_USER must be the approved staging account'; exit 1; }
          test "$STAGING_SFTP_DEST" = '/home/u818755784/domains/savagesbydesign.com/public_html/staging' || {
            echo 'STAGING_SFTP_DEST must be exactly the verified staging document root'; exit 1;
          }

      - name: Prepare strict SSH host verification
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/staging_deploy_key"
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > "$HOME/.ssh/staging_known_hosts"
          chmod 600 "$HOME/.ssh/staging_deploy_key" "$HOME/.ssh/staging_known_hosts"
          ssh-keygen -lf "$HOME/.ssh/staging_known_hosts" >/dev/null

      - name: Verify exact staging destination over SSH and SFTP
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SFTP_DEST: ${{ secrets.STAGING_SFTP_DEST }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "$HOME/.ssh/staging_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/staging_known_hosts" -o BatchMode=yes -o ConnectTimeout=20 -p "$STAGING_SSH_PORT")
          resolved_path="$(ssh "${ssh_opts[@]}" "$STAGING_SSH_USER@$STAGING_SSH_HOST" sh -s -- "$STAGING_SFTP_DEST" <<'REMOTE'
          set -eu
          test "$#" -eq 1
          test -d "$1"
          realpath -e -- "$1"
          REMOTE
          )"
          test "$resolved_path" = "$STAGING_SFTP_DEST" || {
            echo "Resolved SSH destination is not the exact staging root: $resolved_path"; exit 1;
          }
          printf 'verified SSH destination: %s\n' "$resolved_path"
          printf 'pwd\ncd %s\npwd\nls -ld %s\n' "$STAGING_SFTP_DEST" "$STAGING_SFTP_DEST" |
            sftp -q -b - -i "$HOME/.ssh/staging_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/staging_known_hosts" -P "$STAGING_SSH_PORT" "$STAGING_SSH_USER@$STAGING_SSH_HOST"

      - name: Upload static output to verified staging path via SFTP
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SFTP_DEST: ${{ secrets.STAGING_SFTP_DEST }}
        run: |
          set -euo pipefail
          batch_file="$(mktemp)"
          trap 'rm -f "$batch_file"' EXIT
          printf 'cd "%s"\n' "$STAGING_SFTP_DEST" > "$batch_file"

          # Create every generated directory first. The leading '-' makes mkdir
          # idempotent on reruns while every put remains fatal on transfer errors.
          while IFS= read -r -d '' directory; do
            relative="${directory#dist/}"
            if [ "$relative" != "$directory" ]; then
              case "$relative" in
                *[!A-Za-z0-9._/-]*) echo "Unsupported generated path: $relative" >&2; exit 1 ;;
              esac
              printf -- '-mkdir "%s"\n' "$relative" >> "$batch_file"
            fi
          done < <(find dist -type d -print0 | sort -z)

          # Upload each file to its exact path under the verified SFTP cwd.
          while IFS= read -r -d '' file; do
            relative="${file#dist/}"
            case "$relative" in
              *[!A-Za-z0-9._/-]*) echo "Unsupported generated path: $relative" >&2; exit 1 ;;
            esac
            printf 'put "%s" "%s"\n' "$file" "$relative" >> "$batch_file"
          done < <(find dist -type f -print0 | sort -z)

          sftp -b "$batch_file" -i "$HOME/.ssh/staging_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/staging_known_hosts" -P "$STAGING_SSH_PORT" "$STAGING_SSH_USER@$STAGING_SSH_HOST"

      - name: Smoke-test staging routes
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="${STAGING_BASE_URL%/}"
          while IFS='|' read -r slug expected; do
            url="$base/${slug}/"
            body="$(mktemp)"
            trap 'rm -f "$body"' EXIT
            status="$(curl --silent --show-error --location --retry 2 --max-time 30 -o "$body" -w '%{http_code}' "$url")"
            grep -Fq "$expected" "$body"
            grep -Fq "$GITHUB_SHA" "$body"
            printf 'verified %-32s %s\n' "$url" "$status"
            [ "$status" = 200 ]
            rm -f "$body"
            trap - EXIT
          done <<'ROUTES'
          |Savage by Design
          app|Savage by Design App
          offerings|Offerings
          guides|Guides
          reviews|Reviews
          deals|Deals
          contact|Contact
          privacy|Privacy Policy
          terms|Terms of Service
          user-guide|User Guide
          pizza-chicken-pop-support|Pizza Chicken Pop Support
          storydonkey|StoryDonkey
          storydonkey-privacy|StoryDonkey Privacy Policy
          storydonkey-terms|StoryDonkey Terms of Use
          storydonkey-support|StoryDonkey Support
          ROUTES
          ads_body="$(curl --silent --show-error --location --retry 2 --max-time 30 "$base/app-ads.txt")"
          test "$ads_body" = 'google.com, pub-9428188855756038, DIRECT, f08c47fec0942fa0'
          echo 'verified app-ads.txt'
