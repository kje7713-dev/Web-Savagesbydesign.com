name: Deploy Static Site to Staging

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  deploy:
    name: Build, upload, and smoke-test staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build and validate static output
        env:
          SBD_DEPLOYMENT_SHA: ${{ github.sha }}
        run: npm run check

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Require staging-only configuration
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_FTP_HOST: ${{ secrets.STAGING_FTP_HOST }}
          STAGING_FTP_PORT: ${{ secrets.STAGING_FTP_PORT }}
          STAGING_FTP_USER: ${{ secrets.STAGING_FTP_USER }}
          STAGING_FTP_PASS: ${{ secrets.STAGING_FTP_PASS }}
          STAGING_FTP_DEST: ${{ secrets.STAGING_FTP_DEST }}
        run: |
          set -euo pipefail
          : "${STAGING_BASE_URL:?STAGING_BASE_URL is required}"
          : "${STAGING_FTP_HOST:?STAGING_FTP_HOST is required}"
          : "${STAGING_FTP_PORT:?STAGING_FTP_PORT is required}"
          : "${STAGING_FTP_USER:?STAGING_FTP_USER is required}"
          : "${STAGING_FTP_PASS:?STAGING_FTP_PASS is required}"
          : "${STAGING_FTP_DEST:?STAGING_FTP_DEST is required}"
          case "$STAGING_BASE_URL" in
            https://*) ;;
            *) echo 'STAGING_BASE_URL must use HTTPS'; exit 1 ;;
          esac
          case "$STAGING_FTP_DEST" in
            *staging*) ;;
            *) echo 'STAGING_FTP_DEST must include an explicit staging path'; exit 1 ;;
          esac

      - name: Upload static output to staging
        env:
          STAGING_FTP_HOST: ${{ secrets.STAGING_FTP_HOST }}
          STAGING_FTP_PORT: ${{ secrets.STAGING_FTP_PORT }}
          STAGING_FTP_USER: ${{ secrets.STAGING_FTP_USER }}
          STAGING_FTP_PASS: ${{ secrets.STAGING_FTP_PASS }}
          STAGING_FTP_DEST: ${{ secrets.STAGING_FTP_DEST }}
        run: |
          set -euo pipefail
          lftp -c "set ftp:ssl-force true; set ssl:verify-certificate true; set net:timeout 30; open -p \"$STAGING_FTP_PORT\" -u \"$STAGING_FTP_USER\",\"$STAGING_FTP_PASS\" \"$STAGING_FTP_HOST\"; mirror --reverse --delete --continue --dereference --ignore-time dist \"$STAGING_FTP_DEST\"; quit"

      - name: Smoke-test staging routes
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="${STAGING_BASE_URL%/}"
          while IFS='|' read -r slug expected; do
            url="$base/${slug}/"
            body="$(mktemp)"
            trap 'rm -f "$body"' EXIT
            status="$(curl --silent --show-error --location --retry 2 --max-time 30 -o "$body" -w '%{http_code}' "$url")"
            grep -Fq "$expected" "$body"
            grep -Fq "$GITHUB_SHA" "$body"
            printf 'verified %-32s %s\n' "$url" "$status"
            [ "$status" = 200 ]
            rm -f "$body"
            trap - EXIT
          done <<'ROUTES'
          |Savage by Design
          app|Savage by Design App
          offerings|Offerings
          guides|Guides
          reviews|Reviews
          deals|Deals
          contact|Contact
          privacy|Privacy Policy
          terms|Terms of Service
          user-guide|User Guide
          pizza-chicken-pop-support|Pizza Chicken Pop Support
          storydonkey|StoryDonkey
          storydonkey-privacy|StoryDonkey Privacy Policy
          storydonkey-terms|StoryDonkey Terms of Use
          storydonkey-support|StoryDonkey Support
          ROUTES
          ads_body="$(curl --silent --show-error --location --retry 2 --max-time 30 "$base/app-ads.txt")"
          test "$ads_body" = 'google.com, pub-9428188855756038, DIRECT, f08c47fec0942fa0'
          echo 'verified app-ads.txt'
