<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="sbd-deployment" content="{{DEPLOYMENT_SHA}}">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="{{BODY_CLASS}}">
<header class="site-header">
  <div class="header-inner">
    <div class="brand-mark-container">
      <img src="/assets/template-parts/icon_ios-marketing_1024x1024_1x.png" alt="Savage by Design iOS app icon" class="brand-wheel brand-wheel--header" loading="lazy" width="1024" height="1024">
    </div>
    <div class="brand-text-container">
      <a class="brand" href="/">SAVAGE BY DESIGN</a>
    </div>
  </div>
  <button class="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
    <span class="nav-toggle-icon"></span>
    MENU
  </button>
  <nav class="nav">
    <a href="/app/">App</a>
    <a href="/contact/">Contact</a>
  </nav>
</header>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const navToggle = document.querySelector('.nav-toggle');
  const nav = document.querySelector('.nav');
  if (navToggle && nav) {
    navToggle.addEventListener('click', function() {
      const isExpanded = this.getAttribute('aria-expanded') === 'true';
      this.setAttribute('aria-expanded', !isExpanded);
      nav.classList.toggle('nav-open');
    });
    document.addEventListener('click', function(event) {
      if (!nav.contains(event.target) && !navToggle.contains(event.target)) {
        navToggle.setAttribute('aria-expanded', 'false');
        nav.classList.remove('nav-open');
      }
    });
    nav.querySelectorAll('a').forEach(function(link) {
      link.addEventListener('click', function() {
        navToggle.setAttribute('aria-expanded', 'false');
        nav.classList.remove('nav-open');
      });
    });
  }
});
</script>
